<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f0f"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.3" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="6" height="630" fill="#F97316"/>
  
  <!-- Orange accent bar bottom -->
  <rect x="0" y="590" width="1200" height="40" fill="#F97316" opacity="0.15"/>
  
  <!-- Logo mark — A with diagonal stripe -->
  <g transform="translate(80, 80)">
    <!-- Orange stripe -->
    <path d="M 0 110 L 40 10 L 54 10 L 14 110 Z" fill="#F97316"/>
    <!-- Dark A house -->
    <path d="M 36 110 L 70 15 L 104 110 Z" fill="white" opacity="0.92"/>
    <!-- House cutout -->
    <path d="M 70 15 L 84 45 L 56 45 Z" fill="#0f0f0f"/>
    <!-- Inner negative -->
    <path d="M 56 92 L 70 50 L 84 92 Z" fill="#0f0f0f" opacity="0.9"/>
  </g>

  <!-- GRUPO text -->
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="16" font-weight="500" 
        fill="white" opacity="0.55" letter-spacing="6">GRUPO</text>
  <!-- AMSO wordmark -->
  <text x="196" y="148" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" 
        fill="white" letter-spacing="3">AMSO</text>

  <!-- Divider -->
  <rect x="80" y="180" width="60" height="3" fill="#F97316"/>

  <!-- Main headline -->
  <text x="80" y="270" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" 
        fill="white" letter-spacing="1">BUILD YOUR VISION</text>
  <text x="80" y="345" font-family="Arial Black, sans-serif" font-size="58" font-weight="900" 
        fill="white" letter-spacing="1">IN COSTA RICA.</text>

  <!-- Subline -->
  <text x="82" y="410" font-family="Arial, sans-serif" font-size="22" font-weight="400" 
        fill="white" opacity="0.55" letter-spacing="0.5">
    Custom Homes · Villas · Commercial · Pools
  </text>

  <!-- Location badge -->
  <rect x="80" y="450" width="420" height="52" fill="#F97316" opacity="0.12" rx="2"/>
  <rect x="80" y="450" width="4" height="52" fill="#F97316"/>
  <text x="100" y="472" font-family="Arial, sans-serif" font-size="12" font-weight="600" 
        fill="#F97316" letter-spacing="3">GUANACASTE · COSTA RICA</text>
  <text x="100" y="493" font-family="Arial, sans-serif" font-size="15" font-weight="500" 
        fill="white" opacity="0.8">Licensed Contractor · 5+ Years · Transparent Process</text>

  <!-- Right side — website -->
  <text x="1120" y="612" font-family="Arial, sans-serif" font-size="14" font-weight="400" 
        fill="white" opacity="0.35" text-anchor="end" letter-spacing="1">www.grupoamso.com</text>

  <!-- Right decoration circles -->
  <circle cx="1100" cy="200" r="280" fill="none" stroke="#F97316" stroke-width="1" opacity="0.06"/>
  <circle cx="1100" cy="200" r="200" fill="none" stroke="#F97316" stroke-width="1" opacity="0.06"/>
  <circle cx="1100" cy="200" r="120" fill="#F97316" opacity="0.05"/>
</svg>